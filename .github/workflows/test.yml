# Test workflow.
name: Tests

# Run unit tests and vet on pushes to main and on every pull request.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  unit:
    name: Unit tests (mocked/local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Unit tests
        run: gotestsum --format testname --junitfile test-results.xml -- -count=1 -skip '^(TestAcc|TestDWD)' ./...
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results.xml
          if-no-files-found: error
      - name: Report unit test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit tests
          path: test-results.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true
          use-actions-summary: true

  acceptance:
    name: Acceptance tests (Google Workspace / Terraform ${{ matrix.terraform }})
    needs: unit
    runs-on: ubuntu-latest
    environment: Acceptance
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.15.*", "1.16.*"]
    env:
      GOOGLEWORKSPACE_CREDENTIALS: ${{ secrets.GOOGLEWORKSPACE_CREDENTIALS }}
      GOOGLEWORKSPACE_CUSTOMER_ID: ${{ secrets.GOOGLEWORKSPACE_CUSTOMER_ID }}
      GOOGLEWORKSPACE_DOMAIN: ${{ secrets.GOOGLEWORKSPACE_DOMAIN }}
      GOOGLEWORKSPACE_IMPERSONATED_USER_EMAIL: ${{ secrets.GOOGLEWORKSPACE_IMPERSONATED_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Acceptance tests
        if: env.GOOGLEWORKSPACE_CREDENTIALS != ''
        run: make testacc

  acceptance-opentofu:
    name: Acceptance tests (Google Workspace / OpenTofu ${{ matrix.opentofu }})
    needs: unit
    runs-on: ubuntu-latest
    environment: Acceptance
    strategy:
      fail-fast: false
      matrix:
        opentofu: ["1.12.*", "1.13.*"]
    env:
      GOOGLEWORKSPACE_CREDENTIALS: ${{ secrets.GOOGLEWORKSPACE_CREDENTIALS }}
      GOOGLEWORKSPACE_CUSTOMER_ID: ${{ secrets.GOOGLEWORKSPACE_CUSTOMER_ID }}
      GOOGLEWORKSPACE_DOMAIN: ${{ secrets.GOOGLEWORKSPACE_DOMAIN }}
      GOOGLEWORKSPACE_IMPERSONATED_USER_EMAIL: ${{ secrets.GOOGLEWORKSPACE_IMPERSONATED_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ matrix.opentofu }}
          tofu_wrapper: false
          provider_acceptance_tests: true
      - name: Acceptance tests
        if: env.GOOGLEWORKSPACE_CREDENTIALS != ''
        run: make testacc

  acceptance-gmail:
    name: Acceptance tests (Gmail / Terraform)
    needs: unit
    runs-on: ubuntu-latest
    environment: Acceptance
    env:
      GOOGLEWORKSPACE_CREDENTIALS: ${{ secrets.GOOGLEWORKSPACE_CREDENTIALS }}
      GOOGLEWORKSPACE_CUSTOMER_ID: ${{ secrets.GOOGLEWORKSPACE_CUSTOMER_ID }}
      GOOGLEWORKSPACE_DOMAIN: ${{ secrets.GOOGLEWORKSPACE_DOMAIN }}
      GOOGLEWORKSPACE_IMPERSONATED_USER_EMAIL: ${{ secrets.GOOGLEWORKSPACE_IMPERSONATED_USER_EMAIL }}
      GOOGLEWORKSPACE_TEST_GMAIL_USER: ${{ secrets.GOOGLEWORKSPACE_TEST_GMAIL_USER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
          terraform_wrapper: false
      - name: Gmail acceptance tests
        if: env.GOOGLEWORKSPACE_CREDENTIALS != '' && env.GOOGLEWORKSPACE_TEST_GMAIL_USER != ''
        run: make testacc-gmail
